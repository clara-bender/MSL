[project]
name = "msl"
version = "0.1.0"
description = "Lab scripts for hand teleop / dataset tooling, built on openpi"
requires-python = ">=3.10"
dependencies = [
    "pyrealsense2>=2.56.5.9235",
    "xarm>=0.0.4",
    "xarm-python-sdk>=1.17.3",
    "av>=16",
    "datasets==3.6.0",
    "opencv-python>=4.10.0.84",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
